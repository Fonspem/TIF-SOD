# E4 con Chaos Mesh: alternativa opcional, el TIF no la usa (Chaos Mesh no se instala en k3s).
# La variante usada es tc netem en la interfaz privada de cada VM: ver e4_netem.sh.
# Esta afecta solo a los pods de MinIO; la de tc netem, a todo el tráfico entre nodos.
#   kubectl apply -f e4-netem.yaml     # con Chaos Mesh instalado: 200 ms y 5 % de pérdida durante 5 minutos
#   kubectl delete -f e4-netem.yaml    # revierte antes de tiempo
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata: { name: e4-degradada, namespace: minio }
spec:
  action: netem
  mode: all
  selector:
    namespaces: [minio]
    labelSelectors: { app: minio }
  delay: { latency: "200ms", jitter: "20ms" }
  loss: { loss: "5", correlation: "25" }
  duration: "5m"
