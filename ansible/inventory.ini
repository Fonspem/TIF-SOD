# Los nombres vm1..vm4 se resuelven con ssh_config (generado por Vagrant).
# "ip" es la dirección en la red privada, la que usan etcd, k3s y MinIO.
vm1 ip=192.168.56.11
vm2 ip=192.168.56.12
vm3 ip=192.168.56.13
vm4 ip=192.168.56.14

[etcd]
vm1 etcd_name=etcd1
vm2 etcd_name=etcd2
vm3 etcd_name=etcd3

[k3s_server]
vm1

[k3s_agent]
vm2
vm3
vm4

[all:vars]
ansible_user=vagrant
