# Aprovisionamiento completo:  K3S_TOKEN=<token> ansible-playbook site.yml
# Una segunda ejecución no debería reportar cambios (idempotencia).

- name: Base de todas las VM
  hosts: all
  become: true
  tasks:
    - name: Paquetes base (prometheus-node-exporter publica CPU, RAM y red de la VM en el puerto 9100)
      ansible.builtin.apt:
        name: [curl, chrony, jq, iptables, xfsprogs, iproute2, prometheus-node-exporter]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Hora sincronizada (los experimentos comparan tiempos entre nodos)
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    - name: node_exporter prendido (lo lee el Prometheus del anfitrión)
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true

    # Watchdog: libvirt le agrega a cada VM un i6300esb con acción "reset" (Vagrantfile, o
    # scripts/watchdog_vms.sh para las VM ya creadas). systemd lo atiende cada 15 s; si la VM se
    # congela, deja de atenderlo y QEMU la reinicia sola. Origen: docs/postmortems/2026-11-12-vm3.md.
    # Rige desde el próximo arranque de la VM.
    - name: "Watchdog: driver i6300esb disponible (en algunas imágenes viene en linux-modules-extra)"
      ansible.builtin.shell: >-
        modinfo i6300esb >/dev/null 2>&1 ||
        apt-get install -y "linux-modules-extra-$(uname -r)"
      register: wdt_modulo
      changed_when: "'Setting up' in wdt_modulo.stdout"
      tags: [watchdog]

    # Ubuntu tiene los drivers de watchdog en su lista negra y systemd-modules-load la respeta,
    # así que /etc/modules-load.d no alcanza: lo carga un servicio con modprobe explícito.
    - name: "Watchdog: servicio que carga el driver en cada arranque"
      ansible.builtin.copy:
        dest: /etc/systemd/system/tif-watchdog-driver.service
        content: |
          [Unit]
          Description=Driver del watchdog i6300esb (TIF; ver docs/postmortems/2026-11-12-vm3.md)

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/sbin/modprobe i6300esb

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      tags: [watchdog]

    - name: "Watchdog: servicio habilitado (corre en el próximo arranque)"
      ansible.builtin.systemd:
        name: tif-watchdog-driver.service
        enabled: true
        daemon_reload: true
      tags: [watchdog]

    - name: "Watchdog: carpeta de configuración de systemd"
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d
        state: directory
        mode: "0755"
      tags: [watchdog]

    - name: "Watchdog: systemd lo atiende; 30 s sin atenderlo = VM congelada"
      ansible.builtin.copy:
        dest: /etc/systemd/system.conf.d/tif-watchdog.conf
        content: |
          # Incidente de vm3 del 12/11/2026: ver docs/postmortems/2026-11-12-vm3.md
          [Manager]
          RuntimeWatchdogSec=30s
        mode: "0644"
      tags: [watchdog]

    - name: Módulo netem para E4 (en algunas imágenes viene en linux-modules-extra)
      ansible.builtin.shell: >-
        modprobe sch_netem ||
        { apt-get install -y "linux-modules-extra-$(uname -r)" && modprobe sch_netem; }
      register: netem
      changed_when: "'Setting up' in netem.stdout"

    - name: Interfaz de la red privada (la que tiene la IP del inventario)
      ansible.builtin.set_fact:
        iface_privada: >-
          {{ ansible_facts.interfaces | map('regex_replace', '[^a-zA-Z0-9_]', '_') | map('extract', ansible_facts)
             | selectattr('ipv4', 'defined') | selectattr('ipv4.address', 'equalto', ip)
             | map(attribute='device') | first }}

    - name: ¿Hay disco de datos?
      ansible.builtin.stat:
        path: "{{ disco_datos }}"
      register: disco

    - name: Formatear el disco de datos en XFS (sólo si está vacío)
      ansible.builtin.shell: "blkid {{ disco_datos }} || mkfs.xfs {{ disco_datos }}"
      register: mkfs
      changed_when: "'meta-data' in mkfs.stdout"
      when: disco.stat.exists

    - name: Directorio de datos de MinIO
      ansible.builtin.file:
        path: "{{ minio_dir }}"
        state: directory
        mode: "0755"

    - name: Montar el disco de datos en el arranque
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "{{ disco_datos }} {{ minio_dir }} xfs defaults,nofail 0 2"
      when: disco.stat.exists

    - name: Montar el disco de datos ahora
      ansible.builtin.shell: "mountpoint -q {{ minio_dir }} || mount {{ minio_dir }}"
      register: montaje
      changed_when: false
      when: disco.stat.exists

- name: Clúster etcd de 3 miembros (systemd, fuera de k3s)
  hosts: etcd
  become: true
  tasks:
    - name: Descargar etcd
      ansible.builtin.unarchive:
        src: "https://github.com/etcd-io/etcd/releases/download/{{ etcd_version }}/etcd-{{ etcd_version }}-linux-amd64.tar.gz"
        dest: /opt
        remote_src: true
        creates: "/opt/etcd-{{ etcd_version }}-linux-amd64/etcd"

    - name: Instalar binarios
      ansible.builtin.copy:
        src: "/opt/etcd-{{ etcd_version }}-linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        remote_src: true
        mode: "0755"
      loop: [etcd, etcdctl, etcdutl]  # etcdutl restaura instantáneas (respaldo)

    - name: Directorio de configuración
      ansible.builtin.file:
        path: /etc/etcd
        state: directory
        mode: "0755"

    - name: Configuración del miembro
      ansible.builtin.template:
        src: templates/etcd.env.j2
        dest: /etc/etcd/etcd.env
        mode: "0644"
      notify: Reiniciar etcd

    - name: "Unidad systemd (Restart=no: los experimentos deciden cuándo vuelve)"
      ansible.builtin.template:
        src: templates/etcd.service.j2
        dest: /etc/systemd/system/etcd.service
        mode: "0644"
      notify: Reiniciar etcd

    - name: Arrancar etcd (los tres a la vez, para formar el quórum inicial)
      ansible.builtin.systemd:
        name: etcd
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Reiniciar etcd
      ansible.builtin.systemd:
        name: etcd
        state: restarted
        daemon_reload: true

- name: Servidor k3s
  hosts: k3s_server
  become: true
  tasks:
    - name: Instalar k3s server
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        INSTALL_K3S_CHANNEL={{ k3s_channel }} INSTALL_K3S_VERSION={{ k3s_version }}
        INSTALL_K3S_EXEC="server --node-ip {{ ip }} --flannel-iface {{ iface_privada }}
        --write-kubeconfig-mode 644 --disable traefik --disable servicelb" sh -
      environment:
        K3S_TOKEN: "{{ k3s_token }}"  # por ambiente: si la tarea falla, el token no aparece en la salida
      args:
        creates: /usr/local/bin/k3s

    - name: Copiar el kubeconfig al anfitrión
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ../kubeconfig
        flat: true

    - name: Apuntar el kubeconfig a la IP del servidor
      delegate_to: localhost
      become: false
      ansible.builtin.replace:
        path: ../kubeconfig
        regexp: "127.0.0.1"
        replace: "{{ ip }}"

- name: Agentes k3s
  hosts: k3s_agent
  become: true
  tasks:
    - name: Instalar k3s agent
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        INSTALL_K3S_CHANNEL={{ k3s_channel }} INSTALL_K3S_VERSION={{ k3s_version }}
        K3S_URL=https://{{ k3s_server_ip }}:6443
        INSTALL_K3S_EXEC="agent --node-ip {{ ip }} --flannel-iface {{ iface_privada }}" sh -
      environment:
        K3S_TOKEN: "{{ k3s_token }}"  # por ambiente: si la tarea falla, el token no aparece en la salida
      args:
        creates: /usr/local/bin/k3s-agent-uninstall.sh
