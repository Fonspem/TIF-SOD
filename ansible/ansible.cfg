[defaults]
inventory = inventory.ini
host_key_checking = False
interpreter_python = auto_silent
forks = 4

[ssh_connection]
# ssh_config lo genera Vagrant: (cd ../vagrant && vagrant ssh-config) | sed 's/LogLevel FATAL/LogLevel ERROR/' > ssh_config
ssh_args = -F ssh_config -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
